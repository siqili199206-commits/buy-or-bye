<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Buy or Bye running-shoe decision card</title>
  <desc id="desc">A purchase verdict recommending new running shoes for a frequent runner training for a half marathon.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6F2E8"/>
      <stop offset="1" stop-color="#E9F0E6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#26372E" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1100" cy="74" r="190" fill="#DDE8D9"/>
  <circle cx="96" cy="590" r="150" fill="#F1D7B5" opacity="0.72"/>

  <g filter="url(#shadow)">
    <rect x="70" y="58" width="1060" height="514" rx="36" fill="#FFFEFA"/>
  </g>

  <text x="112" y="119" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="700" letter-spacing="3" fill="#738177">BUY OR BYE</text>
  <text x="1085" y="119" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#738177">购买之前，先做判断</text>

  <rect x="108" y="151" width="190" height="58" rx="29" fill="#1F6B4F"/>
  <text x="203" y="190" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="27" font-weight="800" fill="#FFFFFF">BUY · 建议买</text>

  <text x="108" y="274" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="44" font-weight="760" fill="#17271F">这双跑鞋该换了，</text>
  <text x="108" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="44" font-weight="760" fill="#17271F">但先验证脚感，再选具体型号。</text>

  <line x1="108" y1="370" x2="1092" y2="370" stroke="#D8DED8" stroke-width="2"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="108" y="416" font-size="19" font-weight="700" fill="#1F6B4F">真实缺口</text>
    <text x="108" y="450" font-size="24" fill="#26372E">旧鞋磨损，无法可靠覆盖规律训练</text>

    <text x="500" y="416" font-size="19" font-weight="700" fill="#1F6B4F">使用概率</text>
    <text x="500" y="450" font-size="24" fill="#26372E">每周跑 4 次，6 周后参加半马</text>

    <text x="108" y="505" font-size="19" font-weight="700" fill="#B65E2A">关键未知</text>
    <text x="108" y="539" font-size="24" fill="#26372E">尺码、稳定性与长距离脚感</text>

    <text x="720" y="505" font-size="19" font-weight="700" fill="#B65E2A">下一步</text>
    <text x="720" y="539" font-size="24" fill="#26372E">试穿，并先完成一次短距离验证</text>
  </g>
</svg>
